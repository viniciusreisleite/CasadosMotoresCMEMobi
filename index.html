<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - CME Mobi</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top right, #fde047, #eab308, #ca8a04);
      color: #000000;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3vh 2.5vw;
      gap: 2.5vw;
    }

    /* Coluna de Mídia */
    .media-section {
      flex: 0 0 35%;
      height: 100%;
      background: #000000;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 3px solid #ffffff;
    }
    
    #player, #image-display {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.25);
      z-index: 5;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #09090b, #18181b);
      transition: width 0.1s linear;
    }

    /* Coluna Informativa com Fundo Translúcido e Textos em Preto */
    .info-section {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      border: 2px solid rgba(0, 0, 0, 0.15);
      border-radius: 26px;
      padding: 3.5vh 3vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 2vh;
      border-bottom: 2px solid rgba(0, 0, 0, 0.1);
    }
    .header-text {
      flex: 1;
    }
    .badge {
      display: inline-block;
      background: #09090b;
      color: #fde047;
      font-size: clamp(0.75rem, 1vw, 1.05rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 1vh;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .header h1 {
      font-size: clamp(1.4rem, 2.2vw, 2.6rem);
      font-weight: 900;
      line-height: 1.2;
      color: #09090b;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .header h1 span {
      color: #ca8a04;
    }

    .logo-img {
      height: clamp(85px, 14vh, 140px);
      max-width: 260px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
    }

    /* Área de Legenda em Preto com Tipografia Dinâmica */
    
    
      /* Motor de auto-scroll TV */
    .info-section {
      display: flex !important;
      flex-direction: column !important;
      height: 100vh !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      position: relative !important;
      margin-top: 1.5rem !important;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important;
    }
    .caption-box {
      font-size: 2.7vw !important;
      line-height: 1.4 !important;
      font-weight: 600 !important;
      word-wrap: break-word !important;
      white-space: pre-line !important;
      padding-bottom: 6rem !important;
    }
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
      .header-text h1, .header h1 {
      text-transform: uppercase !important;
}
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- Coluna de Mídia -->
    <div class="media-section">
      <img id="image-player" style="display:none; width:100%; height:100%; object-fit:contain; background-color:#050505;" /><video id="player" autoplay playsinline muted loop preload="auto" style="width:100%; height:100%; object-fit:contain; background-color:#050505;"><source id="video-source" src="" type="video/mp4"></video>
      <img id="image-display" alt="Foto do Post" style="display: none;" onerror="this.style.display='none'">
      
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <!-- Coluna Informativa -->
    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">Mobilidade Inteligente</span>
          <h1>CME <span>Mobi</span></h1>
        </div>
        <img src="logo.png" alt="Logo CME Mobi" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações...
        </div>
      </div>
    </div>
  </div>

    <script>
    function iniciarAutoScroll(container) {
      if (!container) return;
      if (window.__scrollInterval) clearInterval(window.__scrollInterval);
      if (window.__scrollTimer) clearTimeout(window.__scrollTimer);

      container.scrollTop = 0;

      window.__scrollTimer = setTimeout(() => {
        const diferenca = container.scrollHeight - container.clientHeight;
        if (diferenca > 15) {
          let descendo = true;
          let pausado = false;

          window.__scrollInterval = setInterval(() => {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= diferenca) {
                pausado = true;
                setTimeout(() => {
                  descendo = false;
                  pausado = false;
                }, 3000); // 3s no fim da leitura
              }
            } else {
              container.scrollTop -= 3;
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(() => {
                  pausado = false;
                }, 3500); // 3.5s no topo antes de novo ciclo
              }
            }
          }, 35);
        }
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const containerElem = document.getElementById('caption-container');
      const captionElem = document.getElementById('caption-text');
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      const timestamp = Date.now();
      let posts = [];

      try {
        const response = await fetch(./data.json?t= + timestamp);
        if (!response.ok) throw new Error(HTTP  + response.status);
        posts = await response.json();
      } catch (err) {
        console.error("Erro ao carregar data.json:", err);
      }

      if (!Array.isArray(posts) || posts.length === 0) {
        if (captionElem) captionElem.textContent = "Não foi possível carregar as informações.";
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const postParam = urlParams.get('post');
      const postIdx = parseInt(postParam, 10);

      let currentPost = posts[0];
      if (!isNaN(postIdx)) {
        currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
      }

      let texto = currentPost.caption || currentPost.text || '';
      texto = texto.replace(/\n{3,}/g, '\n\n').trim();
      if (captionElem) {
        captionElem.textContent = texto;
        iniciarAutoScroll(containerElem);
      }

      const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
      const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

      if (isFoto) {
        if (player) {
          player.pause();
          player.style.display = 'none';
        }
        if (imagePlayer) {
          imagePlayer.style.display = 'block';
          imagePlayer.src = ./ + midiaArquivo + ?t= + timestamp;
        }
      } else {
        if (imagePlayer) imagePlayer.style.display = 'none';
        if (player && videoSource) {
          player.style.display = 'block';
          player.style.backgroundColor = '#000';
          player.loop = true;

          player.onended = () => {
            player.currentTime = 0;
            player.play().catch(() => {});
          };

          videoSource.src = ./ + midiaArquivo + ?t= + timestamp;
          player.load();
          player.play().catch(e => console.log('Autoplay:', e));
        }
      }
    });
  </script>
</body>
</html>
